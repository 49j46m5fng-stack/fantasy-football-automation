name: Probe Week 1 Live Matchups

on:
  workflow_dispatch:

  schedule:
    - cron: "10 0 10 9 *"
      timezone: "America/Chicago"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Probe Sleeper live matchup shape
        run: |
          python -m scripts.probe_week1_live_matchups