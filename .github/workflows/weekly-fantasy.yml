name: Weekly Fantasy Automation

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to run
        required: true
        default: auto
        type: choice
        options:
          - auto
          - baseline
          - sunday
          - repair-sunday-remaining
          - final
          - donuts
          - analytics

      week:
        description: Optional fantasy week for manual stage runs
        required: false
        type: string

      recovery:
        description: Manual out-of-window reconstruction (baseline/sunday only; explicitly labeled)
        required: true
        default: false
        type: boolean

      check_only:
        description: Validate without writing official snapshots
        required: true
        default: false
        type: boolean

  schedule:
    # Monday — Sunday recap / MNF checkpoint.
    - cron: "5 7 * * 1"
      timezone: "America/Chicago"

    - cron: "15 7 * * 1"
      timezone: "America/Chicago"

    - cron: "25 7 * * 1"
      timezone: "America/Chicago"

    # Tuesday — post-MNF final checkpoint.
    - cron: "00 7 * * 2"
      timezone: "America/Chicago"

    - cron: "20 7 * * 2"
      timezone: "America/Chicago"

    - cron: "30 7 * * 2"
      timezone: "America/Chicago"

    # Thursday — normal weekly baseline.
    - cron: "45 11 * * 4"
      timezone: "America/Chicago"

    - cron: "55 11 * * 4"
      timezone: "America/Chicago"

    - cron: "5 12 * * 4"
      timezone: "America/Chicago"

permissions:
  contents: write

concurrency:
  group: weekly-fantasy-automation
  cancel-in-progress: false

jobs:
  weekly:
    name: Run weekly fantasy stage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record checked-out commit
        id: base
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m pytest -q

      - name: Run fantasy automation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_CHECK_ONLY: ${{ inputs.check_only }}
          INPUT_RECOVERY: ${{ inputs.recovery }}
          TZ: America/Chicago
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            DAY_OF_WEEK="$(date +%u)"

            echo "Scheduled automation."
            echo "Central day of week: $DAY_OF_WEEK"

            if [ "$DAY_OF_WEEK" = "2" ]; then
              echo "Tuesday final automation includes Week 1."
              python fantasy.py auto --min-week 1
            else
              echo "Week 1 baseline/Sunday remain on temporary workflows."
              python fantasy.py auto --min-week 2
            fi

            exit 0
          fi

          STAGE="${INPUT_STAGE:-auto}"
          CHECK_FLAG=""

          if [ "$INPUT_CHECK_ONLY" = "true" ]; then
            CHECK_FLAG="--check-only"
          fi

          if [ "$INPUT_RECOVERY" = "true" ] && { [ "$STAGE" != "baseline" ] && [ "$STAGE" != "sunday" ]; }; then
            echo "Recovery is only available for baseline or sunday."
            exit 2
          fi

          if [ "$STAGE" = "auto" ]; then
            python fantasy.py auto \
              --min-week 2 \
              $CHECK_FLAG

            exit 0
          fi

          if [ "$STAGE" = "repair-sunday-remaining" ]; then
            if [ -z "$INPUT_WEEK" ]; then
              echo "repair-sunday-remaining requires a week input."
              exit 2
            fi

            python -m scripts.repair_sunday_remaining \
              --week "$INPUT_WEEK"

            exit 0
          fi

          RECOVERY_FLAG=""
          if [ "$INPUT_RECOVERY" = "true" ]; then
            if [ "$STAGE" != "baseline" ] && [ "$STAGE" != "sunday" ]; then
              echo "Recovery only supports baseline or sunday."
              exit 2
            fi
            if [ -z "$INPUT_WEEK" ]; then
              echo "Recovery requires an explicit week."
              exit 2
            fi
            RECOVERY_FLAG="--recovery"
          fi

          WEEK_FLAG_NAME="--week"

          if [ "$STAGE" = "donuts" ] || [ "$STAGE" = "analytics" ]; then
            WEEK_FLAG_NAME="--through-week"
          fi

          if [ -n "$INPUT_WEEK" ]; then
            python fantasy.py "$STAGE" \
              "$WEEK_FLAG_NAME" "$INPUT_WEEK" \
              $CHECK_FLAG $RECOVERY_FLAG
          else
            python fantasy.py "$STAGE" \
              $CHECK_FLAG $RECOVERY_FLAG
          fi

      - name: Commit generated historical outputs
        if: ${{ github.event_name == 'schedule' || !inputs.check_only }}
        shell: bash
        run: |
          if git status --porcelain | grep -q .; then
            echo "Generated changes detected."
          else
            echo "No generated files to commit."
            exit 0
          fi

          git fetch origin main

          REMOTE_SHA="$(git rev-parse origin/main)"
          INITIAL_SHA="${{ steps.base.outputs.sha }}"

          if [ "$REMOTE_SHA" != "$INITIAL_SHA" ]; then
            echo "main changed while fantasy data was being prepared."
            echo "Refusing to commit output produced from stale code."
            echo "A later scheduled attempt can retry."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data reports

          if git diff --cached --quiet; then
            echo "No historical output files need committing."
            exit 0
          fi

          git commit -m "Run automated fantasy weekly checkpoint"

          git push origin HEAD:main