name: Freeze 2026 Week 1 Baseline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only or attempt the official freeze
        required: true
        default: validate
        type: choice
        options:
          - validate
          - freeze

  schedule:
    - cron: "15 18 9 9 *"
      timezone: "America/Chicago"

    - cron: "45 18 9 9 *"
      timezone: "America/Chicago"

    - cron: "5 19 9 9 *"
      timezone: "America/Chicago"

permissions:
  contents: write

concurrency:
  group: freeze-2026-week-1-baseline
  cancel-in-progress: false

jobs:
  freeze:
    name: Validate and freeze baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record checked-out commit
        id: base
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m pytest -q

      - name: Run baseline automation
        shell: bash
        env:
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'freeze' }}
        run: |
          echo "Run mode: $RUN_MODE"

          if [ "$RUN_MODE" = "validate" ]; then
            python -m scripts.freeze_week1_baseline --check-only
          else
            python -m scripts.freeze_week1_baseline
          fi

      - name: Commit frozen baseline snapshots
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'freeze' }}
        shell: bash
        run: |
          BASELINE_STATUS="$(git status --porcelain -- \
            data/2026/goats/week_01_baseline.json \
            data/2026/doats/week_01_baseline.json)"

          if [ -z "$BASELINE_STATUS" ]; then
            echo "No new baseline snapshots to commit."
            exit 0
          fi

          git fetch origin main

          REMOTE_SHA="$(git rev-parse origin/main)"
          INITIAL_SHA="${{ steps.base.outputs.sha }}"

          if [ "$REMOTE_SHA" != "$INITIAL_SHA" ]; then
            echo "main changed while baseline data was being prepared."
            echo "Refusing to commit a capture produced from stale code."
            echo "A later scheduled attempt can retry from the new main."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/2026/goats/week_01_baseline.json \
            data/2026/doats/week_01_baseline.json

          git commit -m "Freeze 2026 Week 1 baseline"

          git push origin HEAD:main