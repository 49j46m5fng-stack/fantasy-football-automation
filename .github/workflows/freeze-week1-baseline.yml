name: Freeze 2026 Week 1 Baseline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only or attempt the official freeze
        required: true
        default: validate
        type: choice
        options:
          - validate
          - freeze

  schedule:
    - cron: "45 11 9 9 *"
      timezone: "America/Chicago"

    - cron: "55 11 9 9 *"
      timezone: "America/Chicago"

    - cron: "5 12 9 9 *"
      timezone: "America/Chicago"

permissions:
  contents: write

concurrency:
  group: freeze-2026-week-1-baseline
  cancel-in-progress: false

jobs:
  freeze:
    name: Freeze baseline and build AI context
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record checked-out commit
        id: base
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify test dependencies
        run: |
          echo "Python:"
          python --version

          echo "httpx2:"
          python -m pip show httpx2

          echo "FastAPI / Starlette / HTTP packages:"
          python -m pip freeze | grep -Ei 'fastapi|starlette|httpx'

          echo "Import httpx2:"
          python -c "import httpx2; print('httpx2 import OK')"

      - name: Run baseline safety tests
        run: |
          python -m pytest -q \
            --ignore=tests/test_api.py

      - name: Run baseline automation
        shell: bash
        env:
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'freeze' }}
        run: |
          echo "Run mode: $RUN_MODE"

          if [ "$RUN_MODE" = "validate" ]; then
            python -m scripts.freeze_week1_baseline --check-only
          else
            python -m scripts.freeze_week1_baseline
          fi

      - name: Build Week 1 AI context
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'freeze' }}
        run: |
          python fantasy.py context \
            --stage baseline \
            --week 1

      - name: Commit frozen baselines and AI context
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'freeze' }}
        shell: bash
        run: |
          OUTPUT_STATUS="$(git status --porcelain -- \
            data/2026/goats/week_01_baseline.json \
            data/2026/doats/week_01_baseline.json \
            data/2026/agent/week_01_baseline.json)"

          if [ -z "$OUTPUT_STATUS" ]; then
            echo "No new baseline or AI-context files to commit."
            exit 0
          fi

          git fetch origin main

          REMOTE_SHA="$(git rev-parse origin/main)"
          INITIAL_SHA="${{ steps.base.outputs.sha }}"

          if [ "$REMOTE_SHA" != "$INITIAL_SHA" ]; then
            echo "main changed while baseline data was being prepared."
            echo "Refusing to commit output produced from stale code."
            echo "A later scheduled attempt can retry."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/2026/goats/week_01_baseline.json \
            data/2026/doats/week_01_baseline.json \
            data/2026/agent/week_01_baseline.json

          git commit -m "Freeze 2026 Week 1 baseline"

          git push origin HEAD:main