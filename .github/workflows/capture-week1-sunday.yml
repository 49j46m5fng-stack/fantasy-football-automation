name: Capture 2026 Week 1 Sunday Snapshot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only or attempt official capture
        required: true
        default: validate
        type: choice
        options:
          - validate
          - capture

  schedule:
    - cron: "5 7 14 9 *"
      timezone: "America/Chicago"

    - cron: "15 7 14 9 *"
      timezone: "America/Chicago"

    - cron: "25 7 14 9 *"
      timezone: "America/Chicago"

permissions:
  contents: write

concurrency:
  group: capture-2026-week-1-sunday
  cancel-in-progress: false

jobs:
  capture:
    name: Capture Sunday checkpoint and build AI context
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record checked-out commit
        id: base
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m pytest -q

      - name: Capture Sunday stage
        shell: bash
        env:
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'capture' }}
        run: |
          echo "Run mode: $RUN_MODE"

          if [ "$RUN_MODE" = "validate" ]; then
            python -m scripts.capture_week1_sunday --check-only
          else
            python -m scripts.capture_week1_sunday
          fi

      - name: Build Sunday AI context
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'capture' }}
        run: |
          python fantasy.py context \
            --stage sunday \
            --week 1

      - name: Commit Sunday snapshots and AI context
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'capture' }}
        shell: bash
        run: |
          OUTPUT_STATUS="$(git status --porcelain -- \
            data/2026/goats/week_01_sunday.json \
            data/2026/doats/week_01_sunday.json \
            data/2026/agent/week_01_sunday.json)"

          if [ -z "$OUTPUT_STATUS" ]; then
            echo "No new Sunday or AI-context files to commit."
            exit 0
          fi

          git fetch origin main

          REMOTE_SHA="$(git rev-parse origin/main)"
          INITIAL_SHA="${{ steps.base.outputs.sha }}"

          if [ "$REMOTE_SHA" != "$INITIAL_SHA" ]; then
            echo "main changed while Sunday data was being prepared."
            echo "Refusing to commit stale-code output."
            echo "A later scheduled attempt can retry."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/2026/goats/week_01_sunday.json \
            data/2026/doats/week_01_sunday.json \
            data/2026/agent/week_01_sunday.json

          git commit -m "Capture 2026 Week 1 Sunday snapshot"

          git push origin HEAD:main